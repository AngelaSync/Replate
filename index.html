<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Replate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: one phone-width column; sticky top bar, scrolling screen, fixed bottom tab bar; details open as bottom sheets. */
:root{
  --bg:#F6EFE3; --surface:#FFFCF6; --ink:#542E20; --muted:#7A5A4C; --line:#E6D8C6;
  --orange:#DE4525; --orange-ink:#FFFCF6; --yellow:#FFB323; --purple:#9475C8;
  --peach:#F8D7CC; --lav:#E7DDF4; --butter:#FFE7B0;
  --good:#2F7A4B; --good-bg:#DDEFE2; --warn:#9A5B00; --warn-bg:#FFEBC2; --bad:#B23A1E; --bad-bg:#F9DCD3;
  --shadow:0 2px 10px rgba(84,46,32,.08);
  --stage:#EADCC7; --bezel:#24160F; --bezel-edge:#6E4A3C;
  --font:'Hanken Grotesk', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C130F; --surface:#2A1D17; --ink:#F6EFE3; --muted:#CDB9AE; --line:#46332A;
  --orange:#F0643E; --orange-ink:#1C130F; --yellow:#FFB323; --purple:#B39BE0;
  --peach:#4A2C24; --lav:#352C45; --butter:#43361A;
  --good:#8FD3A6; --good-bg:#1F3A2A; --warn:#FFCF70; --warn-bg:#3D2E10; --bad:#FF9C84; --bad-bg:#47221A;
  --shadow:0 2px 10px rgba(0,0,0,.35); --stage:#0F0A08; --bezel:#050302; --bezel-edge:#3A2A22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C130F; --surface:#2A1D17; --ink:#F6EFE3; --muted:#CDB9AE; --line:#46332A;
  --orange:#F0643E; --orange-ink:#1C130F; --yellow:#FFB323; --purple:#B39BE0;
  --peach:#4A2C24; --lav:#352C45; --butter:#43361A;
  --good:#8FD3A6; --good-bg:#1F3A2A; --warn:#FFCF70; --warn-bg:#3D2E10; --bad:#FF9C84; --bad-bg:#47221A;
  --shadow:0 2px 10px rgba(0,0,0,.35); --stage:#0F0A08; --bezel:#050302; --bezel-edge:#3A2A22; color-scheme:dark}
:root[data-theme="dark"] header.top img{background:#F6EFE3;border-radius:12px;padding:4px 8px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-bottom:96px;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:10px;gap:12px}
.top img{height:44px;width:auto}
.top .mode{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--lav);padding:4px 10px;border-radius:999px}
.iconbtn{position:relative;border:0;background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow)}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:var(--orange-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
h1{font-size:26px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}
h2{font-size:19px;margin:18px 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--yellow);border-radius:999px;padding:10px 16px}
.search input{border:0;background:transparent;flex:1;min-width:0;font-size:16px;outline:none}
.search svg{width:20px;height:20px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);padding-block:6px}
.link{border:0;background:none;color:var(--orange);font-weight:700;padding:4px 0}
.card{display:flex;gap:12px;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow);border:0;text-align:left;width:100%;align-items:stretch}
.art{flex:none;width:92px;height:92px;border-radius:16px;display:grid;place-items:center}
.art svg{width:58px;height:58px}
.art.big{width:100%;height:170px;border-radius:24px}
.art.big svg{width:110px;height:110px}
.art.sm{width:64px;height:64px}
.art.sm svg{width:42px;height:42px}
.photopick{display:flex;gap:12px;align-items:center}
.photopick .prev{width:84px;height:84px;border-radius:16px;background:var(--butter);display:grid;place-items:center;overflow:hidden;flex:none}
.photopick .prev img{width:100%;height:100%;object-fit:cover}
.mapwrap{position:relative}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:20px;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:10px 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.c-Bread{background:var(--butter)} .c-Pastries{background:var(--peach)} .c-Meals{background:var(--lav)} .c-Drinks{background:var(--good-bg)}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cbody .name{font-weight:800;font-size:16px;line-height:1.2}
.cbody .shop{font-size:13px;color:var(--muted)}
.price{font-weight:800;font-size:17px}
.price s{font-weight:500;font-size:13px;color:var(--muted);margin-left:4px}
.small{font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;letter-spacing:.02em}
.t-boost{background:var(--yellow);color:#542E20}
.t-left{background:var(--peach)}
.t-ok{background:var(--good-bg);color:var(--good)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)}
.t-plain{background:var(--lav)}
.verified{color:var(--good);font-weight:700}
.allergens{display:flex;gap:4px;flex-wrap:wrap}
.allergens span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 5px}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:800;font-size:16px;background:var(--orange);color:var(--orange-ink);width:100%}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.small{width:auto;padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.boostcard{background:var(--butter);border-radius:20px;padding:14px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.tabs{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px))}
nav.bar .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bar button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
nav.bar button svg{width:24px;height:24px}
nav.bar button[aria-current="page"]{color:var(--orange)}
nav.bar .dot{top:2px;right:calc(50% - 22px)}
.sheetwrap{position:fixed;inset:0;z-index:40;background:rgba(28,19,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:16px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:0;background:var(--surface);border-radius:50%;width:36px;height:36px;font-size:20px;line-height:1}
label{font-weight:700;font-size:14px;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.err{color:var(--bad);font-weight:700;font-size:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{font-weight:600;display:flex;gap:6px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;margin:0}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:800}
.qty b{font-size:20px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.code{font-size:34px;font-weight:800;letter-spacing:.08em;background:var(--butter);border-radius:18px;padding:14px;text-align:center;font-variant-numeric:tabular-nums}
.msgs{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.bubble{max-width:80%;padding:9px 13px;border-radius:18px;font-size:15px}
.bubble.me{align-self:flex-end;background:var(--orange);color:var(--orange-ink);border-bottom-right-radius:6px}
.bubble.them{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.map{background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.map svg{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;max-width:90%;text-align:center}
.doc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .dn{min-width:0;flex:1}
.fileup{position:relative;overflow:hidden}
.fileup input{position:absolute;inset:0;opacity:0;cursor:pointer}
table.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sum td{padding:8px 0;border-bottom:1px solid var(--line)}
table.sum td:last-child{text-align:right;font-weight:800}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14px}
.reslist .card{flex-direction:column;gap:8px}

/* Real map styling (MapLibre vector map recolored in the Replate palette) */
#lmap{border-radius:24px 24px 0 0;overflow:hidden;background:var(--butter);font-family:var(--font)}
#lmap .maplibregl-ctrl-group{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
#lmap .maplibregl-ctrl-group button{width:38px;height:38px}
#lmap .maplibregl-ctrl-attrib{font-size:10px;background:color-mix(in srgb, var(--surface) 85%, transparent);color:var(--muted)}
#lmap .maplibregl-ctrl-attrib a{color:var(--muted)}
.gmk{width:36px;height:52px}
.gpin{position:relative;display:block;border:0;background:none;padding:0;cursor:pointer;width:36px;height:52px}
.gpin .pin{position:absolute;left:0;top:0}
.gpin.has::before{content:"";position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#FFB323;opacity:.55}
@media (prefers-reduced-motion: no-preference){
  .gpin{animation:drop .55s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
  .gpin.has::before{animation:glow 1.8s ease-out infinite}
  @keyframes glow{from{transform:scale(.8);opacity:.6}to{transform:scale(2);opacity:0}}
  .gpin:hover .pin{transform:rotate(-45deg) scale(1.12)}
}
.gpin .pin{transition:transform .15s}
.you{position:relative;width:22px;height:22px}
.you b{position:absolute;inset:4px;border-radius:50%;background:#9475C8;border:3px solid #FFFCF6;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.you i{position:absolute;inset:-10px;border-radius:50%;background:#9475C8;opacity:.25}
@media (prefers-reduced-motion: no-preference){.you i{animation:pulse 2s ease-out infinite}@keyframes pulse{from{transform:scale(.5);opacity:.45}to{transform:scale(1.4);opacity:0}}}
.pin{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #FFFCF6;box-shadow:0 3px 8px rgba(40,20,10,.35);display:grid;place-items:center}
.pin b{transform:rotate(45deg);color:#FFFCF6;font:800 14px 'Hanken Grotesk',Arial,sans-serif}
.pinlabel{position:absolute;top:40px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 11px 'Hanken Grotesk',Arial,sans-serif;color:#542E20;background:#FFFCF6;border-radius:999px;padding:2px 8px;box-shadow:0 1px 4px rgba(40,20,10,.2)}
/* Phone frame: on a phone the frame dissolves and the app uses the real screen; on a laptop it sits inside a drawn phone. */
.stage,.phone,.screen{display:contents}
.status{display:none}
@media (min-width:700px) and (min-height:480px){
  body{display:grid;place-items:center;min-height:100%;background:var(--stage);padding-block:20px}
  body::before{display:none}
  .stage{display:block}
  .phone{display:block;position:relative;width:390px;height:min(844px, calc(100vh - 40px));border-radius:56px;border:12px solid var(--bezel);
    background:var(--bg);overflow:hidden;box-shadow:0 0 0 2px var(--bezel-edge),0 30px 60px rgba(40,20,10,.28)}
  .status{display:flex;position:absolute;top:0;left:0;right:0;height:46px;z-index:25;justify-content:space-between;align-items:center;padding:4px 28px 0;font-weight:800;font-size:15px;background:var(--bg)}
  .sicons{display:flex;gap:5px;align-items:center}
  .notch{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:var(--bezel)}
  .screen{display:block;position:absolute;top:46px;bottom:0;left:0;right:0;overflow-y:auto;padding:0 16px;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .top{top:0}
  nav.bar{position:absolute;padding:0 8px 18px}
  nav.bar::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:var(--ink);opacity:.8}
  .sheetwrap{position:absolute}
  .sheet{padding:16px 16px 34px}
  .toast{position:absolute;bottom:96px}
}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>

let S;
try{ S = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ S=null; }
if(!S || S.v!==1) S = seed();
else {
  /* Demo data: sample listings whose pickup time has passed get fresh times, so Browse is never empty on a later visit. Shop-made listings are left alone. */
  const fresh=seed(); let changed=false;
  S.listings=S.listings.map(l=>{
    if(/^l\d+$/.test(l.id) && (l.pEnd<=now() || l.bb<=now())){
      const f=fresh.listings.find(x=>x.id===l.id);
      if(f){ changed=true; return Object.assign({}, f, {removed:l.removed}); }
    }
    return l;
  });
  if(changed) save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }catch(e){ return false; } }

const shop = id => S.shops.find(s=>s.id===id);
const listing = id => S.listings.find(l=>l.id===id);
const DOCS=[["id","Owner's valid government ID",true],["dti","DTI Business Name Registration (or SEC)",true],["mayor","Mayor's / Business Permit",true],["sanitary","Sanitary Permit",true],["bir","BIR Certificate of Registration (Form 2303)",false]];
const myVerified = () => DOCS.filter(d=>d[2]).every(d=>S.docs[d[0]]==="approved");
const shopVerified = id => id===S.myShop ? myVerified() : true;
const visible = l => !l.removed && l.qty>0 && l.bb>now() && l.pEnd>now() && shopVerified(l.shopId);
const boostActive = l => l.boosted && l.boostUntil>now();
function matches(l){
  const sh=shop(l.shopId), q=S.q.trim().toLowerCase();
  if(q && ![l.name,sh.name,sh.type,l.cat,l.desc].join(" ").toLowerCase().includes(q)) return false;
  const cats=S.chips.filter(c=>["Bread","Pastries","Meals"].includes(c));
  if(cats.length && !cats.includes(l.cat)) return false;
  if(S.chips.includes("under50") && !(l.price<50)) return false;
  if(S.chips.includes("near") && !(dist(sh)<=1.0)) return false;
  if(S.chips.includes("today") && !sameDay(l.pEnd, now())) return false;
  return true;
}
/* Fair rotation: the 2 eligible boosted listings with the fewest views take the top spots; each refresh counts a view. */
function pickBoosted(count){
  const elig=S.listings.filter(l=>visible(l)&&boostActive(l)&&matches(l));
  elig.sort((a,b)=>a.shown-b.shown || a.id.localeCompare(b.id));
  const pick=elig.slice(0,2);
  if(count) pick.forEach(l=>l.shown++);
  S.picks=pick.map(l=>l.id); save();
}
function currentPicks(){
  const ok=S.picks.map(listing).filter(l=>l&&visible(l)&&boostActive(l)&&matches(l));
  if(ok.length<Math.min(2,S.listings.filter(l=>visible(l)&&boostActive(l)&&matches(l)).length)){pickBoosted(false);return S.picks.map(listing);}
  return ok;
}

/* Real map: OpenStreetMap tiles around Angeles City. Shop pins are sample data. */
const CENTER=[15.1450,120.5887];
const COORDS={s1:[15.1475,120.5867],s2:[15.1495,120.5927],s3:[15.1410,120.5837],s4:[15.1530,120.5962],s5:[15.1420,120.5922],s6:[15.1510,120.5802],s7:[15.1395,120.5947]};
const coordOf = s => COORDS[s.id] || [CENTER[0]+((s.id.charCodeAt(1)||0)%7-3)*0.0012, CENTER[1]+((s.id.length*3)%7-3)*0.0012];
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
/* Distances use the viewer's location when it is inside the demo area, otherwise Angeles City center. */
const origin = () => (S.userPos && km(S.userPos,CENTER)<=30) ? S.userPos : CENTER;
const dist = s => km(origin(), coordOf(s));
let lmap=null;
function mapView(){
  const far = S.userPos && km(S.userPos,CENTER)>30;
  return topbar(bell())+`<h1>Shops near you</h1><p class="sub">Tap a pin to see what a shop has left. Numbers show live listings.</p>
  <div class="map"><div id="lmap" style="height:440px;width:100%" aria-label="Map of Angeles City with shop pins"></div>
    <div class="legend"><span><i style="background:var(--orange)"></i>Has food now</span><span><i style="background:var(--muted)"></i>Nothing listed</span><span><i style="background:var(--purple)"></i>${S.userPos&&!far?"You":"Angeles City center"}</span></div></div>
  <div class="stack" style="margin-top:10px"><div class="row" style="flex-wrap:nowrap"><button class="btn alt" data-a="locate">${S.userPos?"Update my location":"Use my location"}</button><button class="btn alt" data-a="tilt" style="width:auto;white-space:nowrap">2D / 3D</button></div>
  <p class="small" style="margin:0">${far?"You're outside the demo area, so distances are measured from Angeles City center.":S.userPos?"Distances are measured from your location.":"Distances are measured from Angeles City center until you share your location."} Tip: you can also tap anywhere on the map to set your spot. Shop pins are sample data. Your location stays on this device.</p></div>`;

function isDark(){const t=document.documentElement.dataset.theme;return t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);}
/* Replate map palette, applied to every layer of an OpenFreeMap vector style */
const MAPPAL={
  light:{bg:"#FBEBD3",land:"#F8E1C4",water:"#C9B8EE",park:"#CDE8B8",wood:"#B7DCA0",bld:"#F6C9B8",bldTop:"#F8D7CC",road:"#FFFCF6",major:"#FFD27A",casing:"#EBC28E",rail:"#D8B9A6",text:"#542E20",halo:"#FFFCF6",waterText:"#6F55A8"},
  dark:{bg:"#3A2A22",land:"#43312A",water:"#5B4C86",park:"#3E5E44",wood:"#46694C",bld:"#7A4A3A",bldTop:"#8C5A48",road:"#6E5548",major:"#C8902E",casing:"#4E3A30",rail:"#5E483C",text:"#FFF3E4",halo:"#2A1D17",waterText:"#D2C2FF"}
};
function paintReplate(map){
  const P=MAPPAL[isDark()?"dark":"light"];
  const set=(id,prop,val)=>{try{map.setPaintProperty(id,prop,val);}catch(_){}};
  const lay=(id,prop,val)=>{try{map.setLayoutProperty(id,prop,val);}catch(_){}};
  (map.getStyle().layers||[]).forEach(l=>{
    const id=l.id, n=id.toLowerCase(), t=l.type, src=(l["source-layer"]||"").toLowerCase();
    if(t==="background"){ set(id,"background-color",P.bg); return; }
    if(t==="fill"){
      if(/water|ocean|river|lake/.test(n+src)) set(id,"fill-color",P.water);
      else if(/wood|forest/.test(n)) set(id,"fill-color",P.wood);
      else if(/park|grass|green|garden|pitch|golf|cemetery|landcover|meadow|scrub/.test(n)) set(id,"fill-color",P.park);
      else if(/building/.test(n+src)) set(id,"fill-color",P.bldTop);
      else set(id,"fill-color",P.land);
      set(id,"fill-outline-color","rgba(0,0,0,0)");
      return; }
    if(t==="fill-extrusion"){ set(id,"fill-extrusion-color",P.bld); set(id,"fill-extrusion-opacity",0.9); return; }
    if(t==="line"){
      if(/water|river|stream|canal/.test(n+src)) set(id,"line-color",P.water);
      else if(/rail|transit/.test(n)) set(id,"line-color",P.rail);
      else if(/casing|outline/.test(n)) set(id,"line-color",P.casing);
      else if(/motorway|trunk|primary/.test(n)) set(id,"line-color",P.major);
      else if(/road|street|highway|path|minor|secondary|tertiary|service|bridge|tunnel/.test(n+src)) set(id,"line-color",P.road);
      else if(/boundary|admin/.test(n)) set(id,"line-color",P.casing);
      return; }
    if(t==="symbol"){
      set(id,"text-color",/water/.test(n+src)?P.waterText:P.text); set(id,"text-halo-color",P.halo); set(id,"text-halo-width",1.6);
      if(/poi/.test(n+src)){ set(id,"icon-opacity",0.55); set(id,"text-opacity",0.8); }
      return; }
  });
}
let gmap=null, gmarkers=[];
function initMap(){
  const el=document.getElementById("lmap"); if(!el) return;
  if(gmap){ try{gmap.remove();}catch(_){} gmap=null; }
  if(typeof maplibregl==="undefined"){ el.innerHTML='<div class="empty"><b>The map needs an internet connection.</b><br>Connect to the internet and open this tab again.</div>'; return; }
  if(maplibregl.supported && !maplibregl.supported()){ el.innerHTML='<div class="empty"><b>This browser can\'t draw the 3D map.</b><br>Try the latest Chrome.</div>'; return; }
  const o=origin(), ll=p=>[p[1],p[0]];
  try{
    gmap=new maplibregl.Map({container:el,style:"https://tiles.openfreemap.org/styles/liberty",center:ll(o),zoom:15.2,pitch:40,bearing:-12,attributionControl:{compact:true},cooperativeGestures:false});
  }catch(e){ el.innerHTML='<div class="empty"><b>The map couldn\'t load.</b><br>Check your internet connection and try again.</div>'; return; }
  gmap.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"top-right");
  gmap.on("styledata",()=>paintReplate(gmap));
  gmap.on("click",e=>{ S.userPos=[e.lngLat.lat,e.lngLat.lng]; save(); render();
    toast(km(S.userPos,CENTER)>30?"That spot is outside the demo area, so distances use Angeles City center.":"Spot set. Distances now measure from here."); });
  gmap.on("load",()=>{
    paintReplate(gmap);
    const b=new maplibregl.LngLatBounds(ll(o),ll(o));
    S.shops.filter(s=>shopVerified(s.id)).forEach(s=>b.extend(ll(coordOf(s))));
    gmap.fitBounds(b,{padding:{top:80,bottom:60,left:60,right:60},pitch:40,bearing:-12,maxZoom:16.4,duration:1200});
  });
  /* You */
  const you=document.createElement("div"); you.innerHTML='<div class="you"><i></i><b></b></div>'; you.title=S.userPos&&o===S.userPos?"You":"Angeles City center";
  new maplibregl.Marker({element:you}).setLngLat(ll(o)).addTo(gmap);
  /* Shops */
  S.shops.filter(s=>shopVerified(s.id)).forEach((s,i)=>{
    const n=S.listings.filter(l=>l.shopId===s.id&&visible(l)).length;
    /* MapLibre positions the outer element with a transform, so the drop-in animation lives on the inner button. */
    const wrap=document.createElement("div"); wrap.className="gmk";
    const m=document.createElement("button"); m.type="button"; m.className="gpin"+(n?" has":""); m.style.animationDelay=(0.15+i*0.08)+"s";
    m.setAttribute("aria-label",`${s.name}, ${n} listing${n===1?"":"s"}`);
    m.innerHTML=`<span class="pin" style="background:${n?"#DE4525":"#8C6A5C"}"><b>${n}</b></span><span class="pinlabel">${esc(s.name)}</span>`;
    m.addEventListener("click",ev=>{ev.stopPropagation(); shopSheet(s.id);});
    wrap.appendChild(m);
    new maplibregl.Marker({element:wrap,anchor:"bottom",offset:[0,12]}).setLngLat(ll(coordOf(s))).addTo(gmap);
  });
}
function tilt(){ if(!gmap) return; const p=gmap.getPitch()>10?0:40; gmap.easeTo({pitch:p,bearing:p?-12:0,duration:700}); }

function locate(){

function msgSheet(id, side){
  const r=S.reservations.find(x=>x.id===id); msgCtx={id,side};
  if(side==="c") r.unreadC=0; else r.unreadS=0; save(); renderBar();

function sendMsg(text){
  const {id,side}=msgCtx, r=S.reservations.find(x=>x.id===id);
  text=text.trim().slice(0,150); if(!text||r.status!=="reserved") return;
  if(r.messages.filter(m=>m.from===side).length>=5) return;
  r.messages.push({from:side,text,t:now()});
  if(side==="c") r.unreadS++; else r.unreadC++;
  save(); msgSheet(id,side);
  if(side==="c" && r.shopId!==S.myShop){
    const reply=AUTO[text]||"See you soon";
    setTimeout(()=>{ if(r.status!=="reserved"||r.messages.filter(m=>m.from==="s").length>=5) return;
      r.messages.push({from:"s",text:reply,t:now()}); r.unreadC++; save(); renderBar();
      if(msgCtx&&msgCtx.id===id&&$("#msgs")) msgSheet(id,"c"); else toast(shop(r.shopId).name+" replied"); },1400);
  }
}

let formPhoto="";
function loadPhoto(file){
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const m=600, s=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      formPhoto=c.toDataURL("image/jpeg",0.75);
      const pb=$("#prevbox"); if(pb) pb.innerHTML=`<img src="${formPhoto}" alt="Food photo preview">`; const cb=$("#clearph"); if(cb) cb.hidden=false; };
    img.onerror=()=>toast("That file isn't a photo we can read. Try a JPG or PNG.");
    img.src=rd.result; };
  rd.readAsDataURL(file);
}

function plusSheet(){
  const p=plusState(), on=hasPlus();
  const feat=[["Sales analytics","Best-selling and slow items, and the best times to post."],["Surplus trends","See which items you overbake on which days, so you can bake less."],["Scheduled daily listings","Post the same leftovers automatically every day."],["Follower alerts","Customers who follow you get notified when you post."],["Multiple branches","Manage every branch from one account."],["20% off boosts","Boost a listing for ₱"+Math.round(BOOST*0.8)+" instead of ₱"+BOOST+"."]];
  openSheet(`${head("Replate Plus")}<div class="stack" style="margin-top:10px">
    <div class="boostcard"><div style="font-size:28px;font-weight:800">₱${PLUS_PRICE}<span style="font-size:15px;font-weight:600"> / month</span></div><div>or ₱${PLUS_YEAR.toLocaleString()} / year (2 months free)</div>
    ${p.status==="trial"?`<div style="margin-top:6px"><b>Free trial ends ${fmtDT(p.until)}.</b></div>`:p.status==="active"?`<div style="margin-top:6px"><b>Active · ${p.plan==="yearly"?"Yearly":"Monthly"} plan, renews ${fmtDT(p.until)}</b></div>`:`<div style="margin-top:6px"><b>Try it free for ${TRIAL_DAYS} days.</b></div>`}</div>
    <div class="panel stack" style="gap:10px">${feat.map(([t,d])=>`<div><b>${t}</b><div class="small">${d}</div></div>`).join("")}</div>
    ${p.status==="none"||p.status==="ended"?`<button class="btn" data-a="plustrial">Start ${TRIAL_DAYS}-day free trial</button>`:""}
    ${p.status!=="active"?`<div class="grid2"><button class="btn alt" data-a="plusbuy" data-plan="monthly">₱${PLUS_PRICE}/month</button><button class="btn alt" data-a="plusbuy" data-plan="yearly">₱${PLUS_YEAR.toLocaleString()}/year</button></div>`:""}
    ${on?`<button class="btn alt" data-a="plusanalytics">Open sales analytics</button><button class="link" data-a="pluscancel">Cancel Replate Plus</button>`:""}
    <p class="small" style="margin:0">During the pilot, Plus is added to your monthly Replate bill. No card needed. Cancel anytime; basic listings stay free.</p></div>`);
}
function analyticsSheet(){
  const done=shopRes().filter(r=>r.status==="collected"), byItem={}, byDay=[0,0,0,0,0,0,0], days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  done.forEach(r=>{ const l=listing(r.listingId); byItem[l.name]=(byItem[l.name]||0)+r.qty; byDay[new Date(r.doneAt||r.created).getDay()]+=r.total; });
  const items=Object.entries(byItem).sort((a,b)=>b[1]-a[1]);
  const mine=S.listings.filter(l=>l.shopId===S.myShop&&!l.removed);
  const slow=mine.filter(l=>!byItem[l.name]).map(l=>l.name);
  const max=Math.max(1,...byDay);
  openSheet(`${head("Sales analytics")}<p class="sub">${esc(shop(S.myShop).name)} · last 7 days</p>
  <div class="panel stack" style="gap:8px"><b>Best sellers</b>${items.length?items.map(([n,q])=>`<div class="row" style="justify-content:space-between"><span>${esc(n)}</span><b>${q} sold</b></div>`).join(""):'<span class="small">No completed pickups yet.</span>'}</div>
  <div class="panel" style="margin-top:10px"><b>Sales by day</b>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin-top:10px">${byDay.map((v,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%"><span class="small" style="font-variant-numeric:tabular-nums">${v?peso(v):""}</span><div style="width:100%;height:${Math.max(4,Math.round(v/max*80))}px;border-radius:6px;background:${v===max&&v?"var(--orange)":"var(--peach)"}"></div><span class="small">${days[i]}</span></div>`).join("")}</div></div>
  <div class="panel stack" style="gap:6px;margin-top:10px"><b>Surplus trends</b>
    <div class="small">${slow.length?`Not sold yet this week: ${slow.map(esc).join(", ")}. Consider baking a little less of ${slow.length>1?"these":"this"}.`:"Everything you listed sold at least once this week."}</div>
    <div class="small">Best time to post: about 1 hour before your pickup window opens.</div></div>
  <p class="small">Based on this demo's sample pickups.</p>`);
}

function verifySheet(){
  const st={approved:'<span class="tag t-ok">Approved</span>',review:'<span class="tag t-warn">Under review</span>',rejected:'<span class="tag t-bad">Rejected</span>',none:'<span class="tag t-plain">Not uploaded</span>'};
  openSheet(`${head("Shop verification")}<p class="sub">${myVerified()?"All required documents are approved. Your shop shows a Verified badge.":"Upload the required documents. You can post listings once they're approved."}</p>
  <div class="panel">${DOCS.map(([k,n,req])=>`<div class="doc"><div class="dn"><b>${n}</b><div class="small">${req?"Required":"Optional"}${S.docFiles[k]?" · "+esc(S.docFiles[k]):""}</div></div>
   <div class="stack" style="gap:6px;align-items:flex-end">${st[S.docs[k]]}${S.docs[k]!=="approved"?`<label class="btn small alt fileup" for="up-${k}" style="margin:0">Upload<input id="up-${k}" type="file" accept="image/*,.pdf" data-doc="${k}"></label>`:""}</div></div>`).join("")}</div>
  <p class="small">Your documents are only used to verify your shop and are kept private under the Data Privacy Act.</p>
  <div class="stack"><button class="btn" data-a="approveall">Approve all (demo)</button><button class="btn alt" data-a="newshop">Start as a new shop (demo)</button></div>`);
}
function summarySheet(){
  const n=new Date(), m=shopRes().filter(r=>r.status==="collected"&&r.doneAt&&new Date(r.doneAt).getMonth()===n.getMonth()&&new Date(r.doneAt).getFullYear()===n.getFullYear());
  const sales=m.reduce((a,r)=>a+r.total,0);
  openSheet(`${head("Monthly summary")}<p class="sub">${n.toLocaleDateString("en-PH",{month:"long",year:"numeric"})} · ${esc(shop(S.myShop).name)}</p>
  <div class="panel"><table class="sum"><tr><td>Completed pickups</td><td>${m.length}</td></tr><tr><td>Completed sales</td><td>${peso(sales)}</td></tr>
  <tr><td>Replate commission (10%)</td><td>${peso(Math.round(sales*0.1))}</td></tr><tr><td>Boosts used</td><td>${S.boostsUsed} · ${peso(S.boostSpend??S.boostsUsed*49)}</td></tr><tr><td>Replate Plus</td><td>${plusState().status==="trial"?"Free trial":plusState().status==="active"?peso(plusState().plan==="yearly"?PLUS_YEAR:PLUS_PRICE):"Not subscribed"}</td></tr></table></div>
  <p class="small">Billed monthly during the pilot. You only pay commission on completed pickups. Customers never pay it.</p>`);
}
function notifSheet(){
  const items=[];
  myRes().filter(r=>r.status==="reserved").forEach(r=>{const l=listing(r.listingId),sh=shop(r.shopId);
    if(r.unreadC) items.push(`<button class="card" data-a="msg" data-id="${r.id}" data-side="c"><div class="cbody"><b>New message from ${esc(sh.name)}</b><span class="small">${esc(r.messages[r.messages.length-1].text)}</span></div></button>`);
    items.push(`<div class="card"><div class="cbody"><b>Pickup at ${esc(sh.name)}</b><span class="small">${r.qty} × ${esc(l.name)} · starts ${fmtDT(l.pStart)}</span></div></div>`);});
  openSheet(`${head("Notifications")}<div class="stack" style="margin-top:10px">${items.join("")||'<div class="empty">No notifications. Pickup reminders show up here after you reserve.</div>'}</div>`);
}

/* ---------- actions ---------- */
function doReserve(id){
  const l=listing(id);
  if(!S.user){ signinSheet(id); return; }
  if(S.blockedUntil>now()){ toast("Reservations are paused after 3 no-shows."); return; }
  if(!visible(l)||detailQty>l.qty){ toast("Only "+l.qty+" left."); detailSheet(id); return; }
  l.qty-=detailQty;
  const r={id:uid("r"),code:"RPL-"+(1000+Math.floor(Math.random()*9000)),listingId:id,shopId:l.shopId,customer:S.user.name,qty:detailQty,total:detailQty*l.price,status:"reserved",mine:true,messages:[],unreadC:0,unreadS:0,created:now()};
  S.reservations.push(r); save(); render(); confirmSheet(r);
}
function setStatus(id,st){
  const r=S.reservations.find(x=>x.id===id); r.status=st; r.doneAt=now();
  if(st==="unclaimed"&&r.mine){ S.noShows++; if(S.noShows>=3){ S.blockedUntil=now()+7*DAY; S.noShows=0; } }
  save(); render(); toast(st==="collected"?"Marked collected":"Marked unclaimed");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]"); if(!t) return;
  const a=t.dataset.a, id=t.dataset.id;
  if(a==="closebg"){ if(e.target===t) closeSheet(); return; }
  switch(a){
    case "tab": S.tab=t.dataset.tab; if(S.tab==="browse") pickBoosted(true); save(); closeSheet(); render(); window.scrollTo(0,0); { const sc=$("#screen"); if(sc) sc.scrollTop=0; } break;
    case "chip": { const k=t.dataset.k; S.chips=S.chips.includes(k)?S.chips.filter(x=>x!==k):[...S.chips,k]; save(); render(); break; }
    case "clear": S.q=""; S.chips=[]; save(); render(); break;
    case "refresh": pickBoosted(true); render(); toast("Updated. Boosted spots rotate on each refresh."); break;
    case "detail": detailSheet(id); break;
    case "shop": shopSheet(id); break;
    case "close": closeSheet(); break;
    case "qty": { const l=listing($("#resbtn").dataset.id); detailQty=Math.max(1,Math.min(l.qty,5,detailQty+Number(t.dataset.d))); $("#qn").textContent=detailQty; $("#resbtn").textContent="Reserve · "+peso(detailQty*l.price); break; }
    case "reserve": doReserve(id); break;
    case "gores": closeSheet(); S.tab="res"; S.resTab="up"; save(); render(); break;
    case "signin": signinSheet(""); break;
    case "signout": S.user=null; save(); render(); toast("Signed out"); break;
    case "notifs": notifSheet(); break;
    case "restab": S.resTab=t.dataset.k; save(); render(); break;
    case "cancel": { const r=S.reservations.find(x=>x.id===id); r.status="cancelled"; r.doneAt=now(); listing(r.listingId).qty+=r.qty; save(); render(); toast("Reservation cancelled"); break; }
    case "msg": msgSheet(id,t.dataset.side); break;
    case "send": sendMsg(t.dataset.t); break;
    case "follow": { S.follows=S.follows.includes(id)?S.follows.filter(x=>x!==id):[...S.follows,id]; save(); toast(S.follows.includes(id)?"Following "+shop(id).name:"Unfollowed"); shopSheet(id); render(); break; }
    case "report": reportSheet(id); break;
    case "mode": S.mode=t.dataset.k; S.tab="profile"; save(); render(); break;
    case "theme": { const th=t.dataset.k==="dark"?"dark":"light"; try{ localStorage.setItem(THEME_KEY,th); }catch(_){} document.documentElement.dataset.theme=th; render(); toast(th==="dark"?"Dark mode on":"Light mode on"); break; }
    case "reset": S=seed(); pickBoosted(true); save(); closeSheet(); render(); toast("Demo data reset"); break;
    case "verify": verifySheet(); break;
    case "summary": summarySheet(); break;
    case "plus": plusSheet(); break;
    case "plustrial": S.plus={status:"trial",until:now()+TRIAL_DAYS*DAY}; save(); render(); plusSheet(); toast("7-day free trial started"); break;
    case "plusbuy": { const pl=t.dataset.plan; S.plus={status:"active",plan:pl,until:now()+(pl==="yearly"?365:30)*DAY}; save(); render(); plusSheet(); toast("Replate Plus is active"); break; }
    case "pluscancel": S.plus={status:"none"}; save(); render(); plusSheet(); toast("Replate Plus cancelled"); break;
    case "plusanalytics": analyticsSheet(); break;
    case "approveall": DOCS.forEach(([k,,req])=>{ if(req||S.docs[k]==="review") S.docs[k]="approved"; }); save(); verifySheet(); render(); toast("All documents approved (demo)"); break;
    case "newshop": DOCS.forEach(([k])=>S.docs[k]="none"); S.docFiles={}; save(); verifySheet(); render(); break;
    case "add": if(!myVerified()){ verifySheet(); break; } formSheet(null); break;
    case "edit": formSheet(id); break;
    case "soldout": listing(id).qty=0; save(); render(); toast("Marked sold out. Boost paused."); break;
    case "remove": removeSheet(id); break;
    case "doremove": listing(id).removed=true; save(); closeSheet(); render(); toast("Listing removed"); break;
    case "boost": boostSheet(id); break;
    case "doboost": { const l=listing(id); l.boosted=true; l.boostUntil=now()+DAY; l.shown=0; S.boostsUsed++; S.boostSpend=(S.boostSpend??(S.boostsUsed-1)*49)+boostPrice(); save(); closeSheet(); render(); toast("Boost active for 24 hours"); break; }
    case "locate": locate(); break;
    case "tilt": tilt(); break;
    case "zoom": { const zs=[1,1.6,2.4]; let i=zs.indexOf(S.mapZoom||1); i=Math.max(0,Math.min(2,i+Number(t.dataset.d))); S.mapZoom=zs[i]; save(); render(); break; }
    case "pickphoto": $("#f-photo").click(); break;
    case "clearphoto": formPhoto=""; $("#prevbox").innerHTML=ART[$("#f-cat").value]; $("#clearph").hidden=true; break;
    case "signoutshop": S.user=null; S.mode="customer"; S.tab="browse"; save(); closeSheet(); render(); toast("Signed out"); break;
    case "collected": setStatus(id,"collected"); break;
    case "unclaimed": setStatus(id,"unclaimed"); break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ S.q=e.target.value; save(); const bb=$("#browsebody"); if(bb) bb.innerHTML=browseBody(); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="f-cat"){ $("#cookwrap").hidden=e.target.value!=="Meals"; if(!formPhoto) $("#prevbox").innerHTML=ART[e.target.value]; }
  if(e.target.id==="f-photo" && e.target.files && e.target.files[0]) loadPhoto(e.target.files[0]);
  if(e.target.dataset && e.target.dataset.doc && e.target.files && e.target.files[0]){ const k=e.target.dataset.doc; S.docs[k]="review"; S.docFiles[k]=e.target.files[0].name; save(); verifySheet(); render(); toast("Uploaded. Under review."); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('g[role="button"]')){ e.preventDefault(); shopSheet(e.target.dataset.id); }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="signform"){
    const n=$("#su-name").value.trim(), m=$("#su-mobile").value.trim(), err=$("#su-err");
    if(!n){ err.textContent="Enter your name."; err.hidden=false; return; }
    if(!/^09\d{9}$/.test(m)){ err.textContent="Enter an 11-digit mobile number starting with 09."; err.hidden=false; return; }
    S.user={name:n,mobile:m}; save(); render(); toast("Welcome, "+n+"!");
    const after=f.dataset.after; if(after){ detailSheet(after); } else closeSheet();
  }
  if(f.id==="msgform"){ sendMsg($("#msgtext").value); }
  if(f.id==="repform"){ closeSheet(); toast("Report sent to the Replate team"); }
  if(f.id==="lform"){
    const err=$("#f-err"), fail=m=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:"center"});};
    const name=$("#f-name").value.trim(), cat=$("#f-cat").value, qty=parseInt($("#f-qty").value,10), orig=Number($("#f-orig").value), price=Number($("#f-price").value);
    const ps=$("#f-ps").value, pe=$("#f-pe").value, bbd=$("#f-bbd").value, bbt=$("#f-bbt").value, ck=$("#f-cook").value;
    const allergens=[...document.querySelectorAll('input[name="alg"]:checked')].map(x=>x.value);
    if(!name) return fail("Add an item name.");
    if(!(qty>=1)) return fail("Quantity must be at least 1.");
    if(!(orig>0)||!(price>0)) return fail("Add both prices.");
    if(price>=orig) return fail("The discounted price must be lower than the original price.");
    if(!ps||!pe||!bbd||!bbt) return fail("Add the pickup window and the best-before date and time.");
    const pStart=atToday(ps), pEnd=atToday(pe), bb=atDate(bbd,bbt);
    if(pEnd<=pStart) return fail("Pickup must end after it starts.");
    if(bb<=pEnd) return fail("Best before must be after the pickup time.");
    let cooked=null, chilled=false;
    if(cat==="Meals"){
      if(!ck) return fail("Cooked meals need a 'Cooked at' time.");
      cooked=atToday(ck);
      chilled=$("#f-store").value==="chilled";
      if(cooked>now()) return fail("'Cooked at' can't be later than now.");
      if(chilled){ if(bb>cooked+24*HOUR) return fail("Refrigerated meals must be eaten within 24 hours of cooking."); }
      else if(bb>cooked+4*HOUR) return fail("Meals kept warm must be eaten within 4 hours of cooking. If you refrigerated it, choose 'Refrigerated'.");
    }
    const id=f.dataset.id;
    if(id){ Object.assign(listing(id),{name,cat,qty,orig,price,pStart,pEnd,bb,cooked,chilled,allergens,photo:formPhoto,desc:$("#f-desc").value.trim()}); }
    else { S.listings.push({id:uid("l"),shopId:S.myShop,name,cat,desc:$("#f-desc").value.trim(),qty,orig,price,pStart,pEnd,bb,cooked,chilled,allergens,photo:formPhoto,boosted:false,boostUntil:0,shown:0,removed:false}); }
    const okSave=save(); closeSheet(); render();
    toast(okSave?(id?"Changes saved":(hasPlus()?"Posted. "+followerCount()+" followers notified.":"Posted. It's live in Browse.")):"Saved for now, but the photo is too big to keep after a refresh. Try a smaller photo.");
  }
});

pickBoosted(true);
render();
function tick(){ const c=$("#clock"); if(c){ const d=new Date(); c.textContent=d.getHours()%12||12; c.textContent+=":"+String(d.getMinutes()).padStart(2,"0"); } }
tick(); setInterval(tick,20000);
})();
</script>
